name: Deploy Backend to DigitalOcean Droplet

on:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    env:
      NODE_INSTALL_VERSION: '22'

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          SSH_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Generate production environment file
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SSL_KEY_PATH: ${{ secrets.SSL_KEY_PATH }}
          SSL_CERT_PATH: ${{ secrets.SSL_CERT_PATH }}
          SSL_CA_PATH: ${{ secrets.SSL_CA_PATH }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote_plus
          required = [
              'DB_HOST', 'DB_PORT', 'DB_USER', 'DB_PASSWORD', 'DB_NAME', 'JWT_SECRET'
          ]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing required production secrets: ' + ', '.join(missing))
          ssl_key = os.environ.get('SSL_KEY_PATH') or '/etc/letsencrypt/live/delta-api.cerbon.id/privkey.pem'
          ssl_cert = os.environ.get('SSL_CERT_PATH') or '/etc/letsencrypt/live/delta-api.cerbon.id/fullchain.pem'
          ssl_ca = os.environ.get('SSL_CA_PATH') or '/etc/letsencrypt/live/delta-api.cerbon.id/chain.pem'
          lines = [
              'NODE_ENV=production',
              'PORT=4000',
              f'DB_HOST={os.environ["DB_HOST"]}',
              f'DB_PORT={os.environ["DB_PORT"]}',
              f'DB_USER={os.environ["DB_USER"]}',
              f'DB_PASSWORD={os.environ["DB_PASSWORD"]}',
              f'DB_NAME={os.environ["DB_NAME"]}',
              f'DATABASE_URL=mysql://{quote_plus(os.environ["DB_USER"])}:{quote_plus(os.environ["DB_PASSWORD"])}@{os.environ["DB_HOST"]}:{os.environ["DB_PORT"]}/{quote_plus(os.environ["DB_NAME"])}',
              f'SSL_KEY_PATH={ssl_key}',
              f'SSL_CERT_PATH={ssl_cert}',
              f'SSL_CA_PATH={ssl_ca}',
              f'JWT_SECRET={os.environ["JWT_SECRET"]}',
              f'JWT_EXPIRES_IN={os.environ.get("JWT_EXPIRES_IN", "1d")}',
          ]
          Path('.env.production').write_text('\n'.join(lines) + '\n')
          PY

      - name: Build backend artifacts on runner
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_INSTALL_VERSION }}

      - name: Install and build (runner)
        run: |
          npm ci
          npm run build

      - name: Sync backend files to server
        run: |
          SSH_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p ~/app ~/backups/delta-be && chmod 755 ~/app ~/backups ~/backups/delta-be"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.github' \
            --exclude 'npm-debug.log*' \
            --exclude '*.log' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/" -e "ssh -p $SSH_PORT"

      - name: Install dependencies, build, verify and restart PM2 (safe deploy)
        env:
          PM2_NAME: delta-be
          HEALTH_URL: https://delta-api.cerbon.id:4000/api/health
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          NODE_INSTALL_VERSION: '22'
        run: |
          SSH_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<EOF
            set -e
            export SUDO_PASSWORD='${{ secrets.SUDO_PASSWORD }}'
            # The repo has already been rsynced to ~/app. Run the safe deploy script from there.
            if [ -f ~/app/deploy/safe_deploy.sh ]; then
              chmod +x ~/app/deploy/safe_deploy.sh
              # Run safe deploy on server: deploy_dir, backup_root, artifact_dir, keep_backups
              ~/app/deploy/safe_deploy.sh ~/app ~/backups/delta-be ~/app 5
            else
              echo "ERROR: ~/app/deploy/safe_deploy.sh not found"
              exit 1
            fi
          EOF
