name: Deploy Backend to DigitalOcean Droplet

on:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          SSH_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Generate production environment file
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SSL_KEY_PATH: ${{ secrets.SSL_KEY_PATH }}
          SSL_CERT_PATH: ${{ secrets.SSL_CERT_PATH }}
          SSL_CA_PATH: ${{ secrets.SSL_CA_PATH }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
        run: |
          cat > .env.production <<'EOF'
          NODE_ENV=production
          PORT=4000
          DB_HOST="$DB_HOST"
          DB_PORT="$DB_PORT"
          DB_USER="$DB_USER"
          DB_PASSWORD="$DB_PASSWORD"
          DB_NAME="$DB_NAME"
          SSL_KEY_PATH="$SSL_KEY_PATH"
          SSL_CERT_PATH="$SSL_CERT_PATH"
          SSL_CA_PATH="$SSL_CA_PATH"
          JWT_SECRET="$JWT_SECRET"
          JWT_EXPIRES_IN="$JWT_EXPIRES_IN"
          EOF

      - name: Sync backend files to server
        run: |
          SSH_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.github' \
            --exclude 'npm-debug.log*' \
            --exclude '*.log' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/" -e "ssh -p $SSH_PORT"

      - name: Install dependencies, build, and restart PM2
        run: |
          SSH_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'
            set -e
            cd ~/app
            npm ci
            npm run build
            chmod 600 .env.production || true
            NODE_ENV=production pm2 restart delta-be --update-env || NODE_ENV=production pm2 start dist/index.js --name delta-be --update-env
          EOF
